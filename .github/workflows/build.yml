name: Build Windows EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Обновлено до v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Обновлено до v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed main3.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # ВАЖНО: Обновлено до v4
        with:
          name: windows-exe-file
          path: dist/main3.exe
